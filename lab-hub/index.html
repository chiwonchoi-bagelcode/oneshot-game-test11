<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>물들임 · 코어 비교</title>
<style>
  :root { --paper:#f4ecdf; --card:#fffaf2; --line:#e4d6bf; --ink:#2b2733; --ink2:#5f5768; --ink3:#8f8696; --accent:#e0563b; --accentd:#b4402a; --jade:#2f8a74; --jaded:#1f6453; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; word-break: keep-all; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 32px); }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 18px; color: var(--ink2); font-size: 14.5px; line-height: 1.55; }
  .card { background: var(--card); border-radius: 20px; box-shadow: 0 1px 0 rgba(120,90,50,.06), 0 8px 22px -12px rgba(90,60,30,.35); padding: 16px; margin-bottom: 12px; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .badge { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 900; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  .card h2 { margin: 1px 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.5; }
  .meta { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink3); }
  .bar { height: 8px; border-radius: 4px; background: #e1d3bb; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--jade), #49b394); }
  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 800; font-size: 16px; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
  .play { background: var(--accent); color: #fff; box-shadow: inset 0 -4px 0 var(--accentd); flex: 1; }
  .reset { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .dbg { margin-left: auto; font-size: 13px; color: var(--ink3); font-weight: 700; padding: 8px; }
  .foot { margin-top: 20px; font-size: 13px; color: var(--ink3); line-height: 1.6; }
  .foot a { color: var(--ink2); }
  .done { color: var(--jade); }
</style>
</head>
<body>
<main>
  <h1>물들임 · 코어 비교</h1>
  <p class="lead">같은 외형에 서로 다른 코어를 넣은 다섯 버전이에요. 버전마다 튜토리얼부터 30단계까지 들어 있고, 진행·재화·튜토리얼 기록은 버전별로 따로 저장돼요. "처음부터"를 누르면 그 버전만 처음 설치한 상태로 돌아가요.</p>
  <div id="list"></div>
  <p class="foot">
    원본 게임은 그대로 <a href="../">기존 주소</a>에 있어요 (저장 데이터도 따로예요).<br />
    "디버그"는 같은 버전에 테스트 패널(왼쪽 가장자리 탭)이 붙은 빌드예요. 그 버전의 저장 데이터를 같이 써요.
  </p>
</main>
<script>
  var VERSIONS = [
    { id: 'a', name: '시간과 무관한 번짐', desc: '놓는 순간과 상관없이 잉크가 정해진 범위만큼 번지고, 겹친 곳은 언제 닿든 섞여요. 어디에 놓을지만 고민해요.' },
    { id: 'b', name: '한붓그리기 혼색', desc: '색마다 시작점에서 손가락으로 길을 그어 칸을 칠해요. 다른 색 길이 겹친 곳이 섞여요.' },
    { id: 'c', name: '그림 완성 색칠놀이', desc: '그림의 구역을 골라 색을 채워요. 두 색을 넣으면 섞여서 새 색이 돼요.' },
    { id: 'd', name: '투입 지점이 보이는 타이밍 퍼즐', desc: '잉크를 놓을 수 있는 자리가 처음부터 보여요. 어떤 자리를 어떤 순서와 박자로 쓸지 정해요.' },
    { id: 'e', name: '첫 방울을 알려주는 추론 퍼즐', desc: '첫 방울 자리를 알려줘요. 번지는 모습을 보고 나머지 자리와 박자를 알아내요.' },
  ];
  function key(v) { return 'inkbloom.v' + v + '.save'; }
  function readSave(v) {
    try { var s = localStorage.getItem(key(v)); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function progress(v) {
    var s = readSave(v);
    if (!s || !s.levels) return null;
    var cleared = 0, sealed = 0;
    for (var id in s.levels) {
      if (id.indexOf(v + '-') !== 0) continue;
      if (s.levels[id].c) cleared++;
      if (s.levels[id].s) sealed++;
    }
    return { cleared: cleared, sealed: sealed, coins: s.coins, plays: (s.stats && s.stats.plays) || 0 };
  }
  function render() {
    var list = document.getElementById('list');
    list.innerHTML = '';
    VERSIONS.forEach(function (v) {
      var p = progress(v.id);
      var card = document.createElement('section');
      card.className = 'card';
      var meta = p
        ? '<div class="meta' + (p.cleared >= 30 ? ' done' : '') + '">진행 ' + p.cleared + '/30 · 낙관 ' + p.sealed + ' · 코인 ' + (p.coins || 0).toLocaleString('ko-KR') + '</div><div class="bar"><i style="width:' + Math.round((p.cleared / 30) * 100) + '%"></i></div>'
        : '<div class="meta">아직 플레이하지 않았어요</div>';
      card.innerHTML =
        '<div class="top"><div class="badge">' + v.id.toUpperCase() + '</div><div><h2>' + v.name + '</h2><p>' + v.desc + '</p></div></div>' +
        meta +
        '<div class="actions"><a class="btn play" href="./' + v.id + '/">' + (p ? '이어서 하기' : '처음 플레이') + '</a>' +
        '<button class="btn reset" type="button" data-v="' + v.id + '">처음부터</button>' +
        '<a class="dbg" href="./' + v.id + '/debug/">디버그</a></div>';
      list.appendChild(card);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.reset'), function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-v');
        if (!confirm(v.toUpperCase() + ' 버전을 처음 설치한 상태로 되돌릴까요? 이 버전의 진행과 재화가 모두 지워져요.')) return;
        try { localStorage.removeItem(key(v)); localStorage.removeItem(key(v) + '.bak'); } catch (e) {}
        render();
      });
    });
  }
  render();
  window.addEventListener('pageshow', render);
</script>
</body>
</html>
